<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>我的订单</title>
    <link rel="shortcut icon" th:href="@{/images/logo/favourite_icon_1.png}">
    <div th:replace="~{css::css}"></div>
</head>
<div th:replace="~{messageStyle::messageStyle}"></div>
<body>

<!-- 现代化弹窗 -->
<div id="modernAlert" class="modern-alert" role="alert">
    <span class="alert-icon" id="alertIcon">✓</span>
    <div class="alert-content" id="alertMessage">操作成功！这是一个示例消息。</div>
    <button type="button" class="btn-close" aria-label="Close"></button>
</div>

<div id="serverMessage" th:if="${message}" th:attr="data-message=${message}, data-type=${messageType ?: 'success'}"
     style="display: none;"></div>

<!-- body_wrap - start -->
<div class="body_wrap">
    <div th:replace="~{component::backtotopAndPreload}"></div>
    <div th:replace="~{component::header-style-3}"></div>
    <!-- main body - start
    ================================================== -->
    <main>
        <div th:replace="~{component::shopping_cart}"></div>
        <!-- breadcrumb_section - start
        ================================================== -->
        <div class="breadcrumb_section">
            <div class="container">
                <ul class="breadcrumb_nav ul_li">
                    <li><a href="/index">主页</a></li>
                    <li>我的订单</li>
                </ul>
            </div>
        </div>
        <!-- breadcrumb_section - end
        ================================================== -->
        <!-- cart_section - start
        ================================================== -->
        <section class="cart_section section_space">
            <div class="container">
                <div class="cart_table">
                    <table class="table mb-0">
                        <thead>
                        <tr>
                            <th>订单编号</th>
                            <th class="text-center">蛋糕</th>
                            <th class="text-center" style="width: 200px">总共价格</th>
                            <th class="text-center">地址</th>
                            <th class="text-center" style="width: 150px">状态</th>
                            <th class="text-center">下单日期</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="order:${orderList}">
                            <td>
                                <div class="cart_product">
                                    <h3 th:text="${order.orderId}"></h3>
                                </div>
                            </td>
                            <td class="text-center"><span
                                    th:utext="${order.orderItems}"></span></td>
                            <td class="text-center"><span class="price_text text-success"
                                                          th:text="'￥'+${order.totalPrice}"></span></td>
                            <td class="text-center"><span
                                    th:text="${order.address}"></span></td>
                            <td class="price_text text-success text-center"><span
                                    th:text="${order.orderStatus}"></span></td>
                            <td class="text-center"><span class="price_text" th:text="${order.orderDate}"></span></td>
                        </tr>
                        <script th:inline="javascript">
                            function addToCart(cakeId, quantity) {
                                const url = '/cart/addToCart/' + cakeId + '/' + quantity;
                                $.get(url)
                                var flag = [[${addFail}]];
                                if (!flag) {
                                    alert('添加成功')
                                } else {
                                    alert('添加失败，购物车已满')
                                }
                            }

                            function removeFromWish(cakeId) {
                                const url = '/wish/remove/' + cakeId;
                                $.get(url)
                                window.location.reload();
                            }
                        </script>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
        <!-- cart_section - end
        ================================================== -->
        <div th:replace="~{component::newsletter}"></div>
    </main>
    <!-- main body - end
    ================================================== -->
    <div th:replace="~{component::footer}"></div>
</div>
<!-- body_wrap - end -->
<div th:replace="~{js::js}"></div>
</body>
</html>
