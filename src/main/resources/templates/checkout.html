<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>结账</title>
    <link rel="shortcut icon" th:href="@{/images/logo/favourite_icon_1.png}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/woocommerce-2.css}">
    <div th:replace="~{css::css}"></div>

</head>

<div th:replace="~{messageStyle::messageStyle}"></div>

<body>

<!-- 现代化弹窗 -->
<div id="modernAlert" class="modern-alert" role="alert">
    <span class="alert-icon" id="alertIcon">✓</span>
    <div class="alert-content" id="alertMessage">操作成功！这是一个示例消息。</div>
    <button type="button" class="btn-close" aria-label="Close"></button>
</div>

<div id="serverMessage" th:if="${message}" th:attr="data-message=${message}, data-type=${messageType ?: 'success'}"
     style="display: none;"></div>

<!-- body_wrap - start -->
<div class="body_wrap">

    <div th:replace="~{component::backtotopAndPreload}"></div>

    <div th:replace="~{component::header-style-3}"></div>

    <!-- main body - start
    ================================================== -->
    <main>

        <div th:replace="~{component::shopping_cart}"></div>

        <!-- breadcrumb_section - start
        ================================================== -->
        <div class="breadcrumb_section">
            <div class="container">
                <ul class="breadcrumb_nav ul_li">
                    <li><a href="/index">主页</a></li>
                    <li>结账</li>
                </ul>
            </div>
        </div>
        <!-- breadcrumb_section - end
        ================================================== -->


        <!-- checkout-section - start
        ================================================== -->
        <section class="checkout-section section_space">
            <div class="container">
                <div class="row">
                    <div class="col col-xs-12">
                        <div class="woocommerce">
                            <form name="checkout" method="post" class="checkout woocommerce-checkout"
                                  action="/checkout/checkout" enctype="multipart/form-data">
                                <div class="col2-set" id="customer_details">
                                    <div class="coll-1">
                                        <h3>选择已有地址</h3>
                                        <div class="form-check" th:each="item : ${addressList}">
                                            <input class="form-check-input" type="radio" name="existAddress"
                                                   id="flexRadioDefault1" th:value="${item?.content}" checked="checked">
                                            <label class="form-check-label" for="flexRadioDefault1"
                                                   th:text="${item?.content}">
                                                Default radio
                                            </label>
                                        </div>
                                    </div>
                                    <br/>
                                    <div class="coll-1">
                                        <div class="woocommerce-billing-fields">
                                            <h3>新增地址</h3>
                                            <p class="form-row form-row form-row-first validate-required"
                                               id="billing_first_name_field">
                                                <label for="billing_first_name" class="">输入一个新地址（输入后会以该地址下单）<abbr
                                                        class="required" title="required">*</abbr></label>
                                                <input type="text" class="input-text " name="address"
                                                       id="billing_first_name" placeholder="" autocomplete="given-name"
                                                       value=""/>
                                            </p>
                                        </div>
                                    </div>
                                </div>
                                <h3 id="order_review_heading">您的订单</h3>
                                <div id="order_review" class="woocommerce-checkout-review-order">
                                    <table class="shop_table woocommerce-checkout-review-order-table">
                                        <thead>
                                        <tr>
                                            <th class="product-name">蛋糕</th>
                                            <th class="product-total">总价</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr class="cart_item" th:each="item : ${cartItems}">
                                            <td class="product-name">
                                                <span1 th:text="${item.cake.name}"></span1>
                                                <strong class="product-quantity">&times;
                                                    <span1 th:text="${item.num}"></span1>
                                                </strong>
                                            </td>
                                            <td class="product-total">
                                                <span class="woocommerce-Price-amount amount"><span
                                                        class="woocommerce-Price-currencySymbol">￥</span><span1
                                                        th:text="${item.cake.amount}">165.00</span1></span>
                                            </td>
                                        </tr>
                                        </tbody>
                                        <tfoot>
                                        <tr class="cart-subtotal">
                                            <th>小计</th>
                                            <td><span class="woocommerce-Price-amount amount"><span
                                                    class="woocommerce-Price-currencySymbol">￥</span><span1
                                                    th:text="${subtotal}">165.00</span1></span>
                                            </td>
                                        </tr>
                                        <tr class="shipping">
                                            <th>运费</th>
                                            <td data-title="Shipping">
                                                免运费
                                                <input type="hidden" name="shipping_method[0]" data-index="0"
                                                       id="shipping_method_0" value="free_shipping:1"
                                                       class="shipping_method"/>
                                            </td>
                                        </tr>
                                        <tr class="order-total">
                                            <th>总计</th>
                                            <td><strong><span class="woocommerce-Price-amount amount"><span
                                                    class="woocommerce-Price-currencySymbol">￥</span><span1
                                                    th:text="${subtotal}">165.00</span1></span></strong></td>
                                        </tr>
                                        </tfoot>
                                    </table>
                                    <div id="payment" class="woocommerce-checkout-payment">
                                        <ul class="wc_payment_methods payment_methods methods">
                                            <li class="wc_payment_method payment_method_paypal">
                                                <input id="payment_method_paypal" type="radio" class="input-radio"
                                                       name="payment_method" value="paypal" checked='checked'
                                                       data-order_button_text="Proceed to PayPal"/>
                                                <label for="payment_method_paypal">余额支付</label>
                                            </li>
                                        </ul>
                                        <div class="form-row place-order">

                                            <input type="submit" class="button alt"
                                                   id="place_order"
                                                   value="确认订单">
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- checkout-section - end
        ================================================== -->
        <!--        <script>-->
        <!--            function checkoutOrder() {-->
        <!--                $.get('/checkout/checkout')-->
        <!--                alert('下单成功')-->
        <!--                window.location = '/index'-->
        <!--            }-->
        <!--        </script>-->
        <div th:replace="~{component::newsletter}"></div>
    </main>
    <!-- main body - end
    ================================================== -->
    <div th:replace="~{component::footer}"></div>
</div>
<!-- body_wrap - end -->

<div th:replace="~{js::js}"></div>

</body>
</html>
