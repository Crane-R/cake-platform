<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">

    <title>购物车</title>
    <link rel="shortcut icon" th:href="@{/images/logo/favourite_icon_1.png}">
    <div th:replace="~{css::css}"></div>

</head>

<body>

<!-- body_wrap - start -->
<div class="body_wrap">

    <div th:replace="~{component::backtotopAndPreload}"></div>

    <div th:replace="~{component::header-style-3}"></div>

    <!-- main body - start
    ================================================== -->
    <main>

        <div th:replace="~{component::shopping_cart}"></div>

        <!-- breadcrumb_section - start
        ================================================== -->
        <div class="breadcrumb_section">
            <div class="container">
                <ul class="breadcrumb_nav ul_li">
                    <li><a href="/index">主页</a></li>
                    <li>购物车</li>
                </ul>
            </div>
        </div>
        <!-- breadcrumb_section - end
        ================================================== -->

        <!-- cart_section - start
        ================================================== -->
        <section class="cart_section section_space">
            <div class="container">
                <div class="cart_update_wrap">
                    <p class="mb-0"><i class="fal fa-check-square"></i>运费已更新</p>
                </div>

                <div class="cart_table">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>蛋糕</th>
                            <th class="text-center">单价</th>
                            <th class="text-center">数量</th>
                            <th class="text-center">总共</th>
                            <th class="text-center">删除</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="cartItem :${cartItems}">
                            <td>
                                <div class="cart_product">
                                    <img th:src="@{'/upload_img/'+${cartItem.cake.attachmentName}}"
                                         alt="image_not_found">
                                    <h3><a href="shop_details.html" th:text="${cartItem.cake.name}">Your Product Title
                                        Here</a></h3>
                                </div>
                            </td>
                            <td class="text-center"><span class="price_text"
                                                          th:text="'￥'+${cartItem.cake.price}">$10.50</span></td>
                            <td class="text-center">
                                <form action="#">
                                    <div class="quantity_input">
                                        <button type="button" class="input_number_decrement">
                                            <i class="fal fa-minus"></i>
                                        </button>
                                        <input th:classappend="'input_number_'+${cartItemStat.index}" type="text"
                                               value="1" th:value="${cartItem.num}"/>
                                        <button type="button" class="input_number_increment">
                                            <i class="fal fa-plus"></i>
                                        </button>
                                    </div>
                                </form>
                            </td>
                            <td class="text-center"><span class="price_text" th:text="'￥'+${cartItem.cake.amount}">$10.50</span>
                            </td>
                            <td class="text-center">
                                <button type="button" class="remove_btn" th:onclick="|removeFromCart(${cartItem.cake.cakeId})|">
                                    <i class="fal fa-trash-alt"></i></button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <script th:inline="javascript">
                    function removeFromCart(cakeId) {
                        const url = '/cart/remove/' + cakeId;
                        $.get(url)
                    }
                </script>

                <div class="cart_btns_wrap">
                    <div class="row">
                        <div class="col col-lg-6">
                            <form action="#">
                                <div class="coupon_form form_item mb-0">
                                    <div class="info_icon">
                                    </div>
                                </div>
                            </form>
                        </div>

                        <div class="col col-lg-6">
                            <ul class="btns_group ul_li_right">
                                <li><a class="btn border_black" href="/cart/index">更新购物车</a></li>
                                <li><a class="btn btn_dark" href="/checkout/index">结账</a></li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col col-lg-12">
                        <div class="cart_total_table">
                            <h3 class="wrap_title">购物车总计</h3>
                            <ul class="ul_li_block">
                                <li>
                                    <span>购物车小计</span>
                                    <span th:text="'￥'+${subtotal}">$52.50</span>
                                </li>
                                <li>
                                    <span>运费及打包</span>
                                    <span>免运费</span>
                                </li>
                                <li>
                                    <span>订单总计</span>
                                    <span class="total_price" th:text="'￥'+${subtotal}">$52.50</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- cart_section - end
        ================================================== -->
        <div th:replace="~{component::newsletter}"></div>
    </main>
    <!-- main body - end
    ================================================== -->
    <div th:replace="~{component::footer}"></div>
</div>
<!-- body_wrap - end -->
<div th:replace="~{js::js}"></div>
</body>
</html>
